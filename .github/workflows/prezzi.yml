name: Aggiorna prezzi

on:
  workflow_dispatch:   # per ora solo avvio manuale (prova)

permissions:
  contents: write

concurrency:
  group: prezzi
  cancel-in-progress: false

jobs:
  prezzi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica i prezzi
        run: node scripts/prezzi.mjs
      - name: Salva prices.json
        run: |
          git config user.name "prezzi-bot"
          git config user.email "prezzi-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Aggiornamento prezzi" && git push)
