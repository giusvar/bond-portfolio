name: Aggiorna prezzi

on:
  workflow_dispatch:
  push:
    paths:
      - titoli.json
  schedule:
   - cron: "3,13,23,33,43,53 7-17 * * 1-5"
   - cron: "37 19 * * 1-5"

permissions:
  contents: write

concurrency:
  group: prezzi
  cancel-in-progress: false

jobs:
  prezzi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica i prezzi
        run: node scripts/prezzi.mjs
            - name: Salva prices.json
        run: |
          git config user.name "prezzi-bot"
          git config user.email "prezzi-bot@users.noreply.github.com"
          git add prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiornamento prezzi"
            # Tenta di allineare la cronologia in caso di modifiche remote
            if ! git pull --rebase origin main; then
              echo "⚠️ Conflitto durante il rebase. Risoluzione automatica in corso..."
              # In caso di conflitto, mantieni la versione appena generata
              git checkout --ours prices.json
              git add prices.json
              # Continua il rebase con la versione locale
              git rebase --continue
            fi
            git push
          fi
